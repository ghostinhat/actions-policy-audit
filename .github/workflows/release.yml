name: Publish verified release

on:
  push:
    tags:
      - "v0.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Verify the release contents
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          # Checkout may resolve its local tag ref to the peeled commit.
          # Read the remote annotation into a separate local ref without
          # changing any public ref or weakening the annotated-tag check.
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/release-verification/source-tag"
          [[ "$(git cat-file -t refs/release-verification/source-tag)" == "tag" ]]
          [[ "$(git rev-parse 'refs/release-verification/source-tag^{commit}')" == "$(git rev-parse HEAD)" ]]
          expected="$(printf '%s\n' \
            .github/workflows/release.yml \
            LICENSE \
            README.md \
            action.yml \
            actions_policy_audit.py \
            tests/test_audit.py \
            verify.sh | sort)"
          actual="$(git ls-files | sort)"
          [[ "$actual" == "$expected" ]]
          ./verify.sh

      - name: Publish the ordinary GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          notes="$(git for-each-ref --format='%(contents)' refs/release-verification/source-tag)"
          [[ -n "$notes" ]]
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Actions Policy Audit $GITHUB_REF_NAME" \
            --notes "$notes"
